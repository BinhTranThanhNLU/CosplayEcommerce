spring.application.name=cosplay

#turn off banner
spring.main.banner-mode=off

#reduce logging level to warn
logging.level.root=warn

#connect to MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/cosplay?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

#path
server.servlet.context-path=/api

# JWT
app.jwt.secret=CosplayEcommerceJwtSecretKeyChangeMe1234567890
app.jwt.expiration-ms=86400000
